name: Credential Rotation Reminder

on:
  schedule:
    # Run on the 1st day of every quarter at 9 AM UTC (Jan 1, Apr 1, Jul 1, Oct 1)
    - cron: "0 9 1 1,4,7,10 *"
  workflow_dispatch:

jobs:
  create-reminder-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create rotation reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const quarter = Math.ceil((new Date().getMonth() + 1) / 3);
            
            const issueBody = `## Quarterly Credential Rotation - Q${quarter} ${new Date().getFullYear()}

This is an automated reminder to rotate credentials according to the [Credential Rotation Policy](../blob/main/docs/security/credential-rotation-policy.md).

### Credentials to Rotate

- [ ] **Database credentials** (DATABASE_URL, DIRECT_DATABASE_URL)
  - Provider: [Prisma Data Platform](https://console.prisma.io)
  - Rotation interval: 90 days
  - Last rotated: _[Add date]_

- [ ] **Clerk secret key** (CLERK_SECRET_KEY)
  - Provider: [Clerk Dashboard](https://dashboard.clerk.com)
  - Rotation interval: 180 days (every 2 quarters)
  - Last rotated: _[Add date]_

- [ ] **Resend API key** (RESEND_API_KEY)
  - Provider: [Resend Dashboard](https://resend.com/api-keys)
  - Rotation interval: 90 days
  - Last rotated: _[Add date]_

- [ ] **Ably API key** (ABLY_API_KEY)
  - Provider: [Ably Dashboard](https://ably.com/accounts)
  - Rotation interval: 90 days
  - Last rotated: _[Add date]_

- [ ] **OpenAI API key** (OPENAI_API_KEY)
  - Provider: [OpenAI Dashboard](https://platform.openai.com/api-keys)
  - Rotation interval: 90 days
  - Last rotated: _[Add date]_

- [ ] **Anthropic API key** (ANTHROPIC_API_KEY)
  - Provider: [Anthropic Console](https://console.anthropic.com/settings/keys)
  - Rotation interval: 90 days
  - Last rotated: _[Add date]_

### Rotation Steps

1. **Rotate credentials** in each provider dashboard
2. **Update local environment**: Edit \`.env.local\` with new values
3. **Update Vercel environment variables**:
   \`\`\`bash
   vercel env rm <VARIABLE_NAME> production preview
   vercel env add <VARIABLE_NAME> production preview
   \`\`\`
4. **Redeploy application**: \`vercel --prod\`
5. **Verify old credentials are revoked** and new ones work
6. **Update rotation log**: Add entry to \`docs/security/rotation-log.md\`

### Verification

- [ ] Old credentials fail authentication
- [ ] New credentials work in all environments
- [ ] Production deployment is healthy
- [ ] No unauthorized access in logs

### Documentation

After completing rotation, update:
- \`docs/security/rotation-log.md\` with rotation date and owner
- This issue with "Last rotated" dates above

---
**Generated**: ${today}
**Policy**: [docs/security/credential-rotation-policy.md](../blob/main/docs/security/credential-rotation-policy.md)`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Security] Quarterly Credential Rotation - Q${quarter} ${new Date().getFullYear()}`,
              body: issueBody,
              labels: ['security', 'maintenance', 'credential-rotation']
            });
